name: Feature or requirement
description: Propose a scoped Redgres capability or requirement change
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the operator/user problem, not only a solution.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements and acceptance criteria
      description: Reference existing PRD IDs or propose new stable IDs.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security, data, migration, and rollback impact
    validations:
      required: true
