# Publish application release: bump VERSION, sync packages, tag, upload assets.
#
# Operator flow (every release):
#   Actions → release → Run workflow → bump = current | patch | minor | major
#
# Starts from root VERSION (1.0.0). No free-typed semver.
# The job:
#   1. Computes next X.Y.Z from VERSION + bump
#   2. Writes VERSION and syncs web/package*.json via scripts/
#   3. Commits those files onto the branch so later commits keep that version
#   4. Creates annotated tag vX.Y.Z
#   5. Builds linux/amd64 tarball + SHA256SUMS
#   6. Creates the GitHub Release with auto-generated commit notes + assets
#      (install.sh / upgrade.sh download those assets)
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump from root VERSION (start 1.0.0). Use current for first release of the file as-is.
        required: true
        type: choice
        options:
          - current
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: Mark GitHub Release as prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve bump from VERSION
        id: ver
        run: |
          set -euo pipefail
          BUMP="${{ github.event.inputs.bump }}"
          CURRENT="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be X.Y.Z (got '$CURRENT')" >&2
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<<"$CURRENT"
          case "$BUMP" in
            current)
              VER="$CURRENT"
              ;;
            patch)
              PATCH=$((PATCH + 1))
              VER="${MAJOR}.${MINOR}.${PATCH}"
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              VER="${MAJOR}.${MINOR}.${PATCH}"
              ;;
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              VER="${MAJOR}.${MINOR}.${PATCH}"
              ;;
            *)
              echo "unknown bump '$BUMP'" >&2
              exit 1
              ;;
          esac
          TAG="v${VER}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists" >&2
            exit 1
          fi
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" && "$PREV_TAG" == "$TAG" ]]; then
            echo "previous tag equals new tag ${TAG}" >&2
            exit 1
          fi
          {
            echo "current=${CURRENT}"
            echo "version=${VER}"
            echo "tag=${TAG}"
            echo "bump=${BUMP}"
            echo "previous_tag=${PREV_TAG}"
          } >>"$GITHUB_OUTPUT"
          echo "bump ${BUMP}: ${CURRENT} -> ${VER} (tag ${TAG}; previous=${PREV_TAG:-none})"

      - name: Write VERSION and sync packages
        run: |
          set -euo pipefail
          chmod +x scripts/set-version.sh scripts/sync-version.sh deploy/build-release.sh
          ./scripts/set-version.sh "${{ steps.ver.outputs.version }}"

      - name: Commit VERSION onto branch
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          BUMP="${{ steps.ver.outputs.bump }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION web/package.json web/package-lock.json
          if git diff --cached --quiet; then
            echo "VERSION already at ${VER}; no package commit needed"
          else
            git commit -m "chore(release): ${BUMP} VERSION to ${VER}"
          fi
          git push origin "HEAD:${{ github.ref_name }}"
          git tag -a "${TAG}" -m "Redgres ${TAG}"
          git push origin "${TAG}"

      - name: Build commit changelog
        id: notes
        run: |
          set -euo pipefail
          PREV="${{ steps.ver.outputs.previous_tag }}"
          TAG="${{ steps.ver.outputs.tag }}"
          {
            echo "## Commits"
            echo
            if [[ -n "$PREV" ]]; then
              git log "${PREV}..HEAD" --pretty=format:'- %s (%h)' --no-merges
            else
              git log HEAD --pretty=format:'- %s (%h)' --no-merges
            fi
            echo
            echo
            echo "_Tag ${TAG} from bump \`${{ steps.ver.outputs.bump }}\` (${{ steps.ver.outputs.current }} → ${{ steps.ver.outputs.version }})._"
          } >"${RUNNER_TEMP}/release-notes.md"
          echo "path=${RUNNER_TEMP}/release-notes.md" >>"$GITHUB_OUTPUT"

      - name: Build release tarball
        run: |
          set -euo pipefail
          ./deploy/build-release.sh "${{ steps.ver.outputs.version }}"
          ls -la dist/release
          test -f "dist/release/redgres_${{ steps.ver.outputs.version }}_linux_amd64.tar.gz"
          test -f dist/release/SHA256SUMS

      - name: Publish GitHub Release + assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Redgres ${{ steps.ver.outputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            dist/release/redgres_${{ steps.ver.outputs.version }}_linux_amd64.tar.gz
            dist/release/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
