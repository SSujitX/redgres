# Publish application release: write VERSION, sync packages, tag, upload assets.
#
# Operator flow (every release):
#   Actions → release → Run workflow → version = X.Y.Z
#
# The job:
#   1. Writes root VERSION and syncs web/package*.json via scripts/
#   2. Commits those files onto the branch so later commits show that version
#   3. Creates annotated tag vX.Y.Z
#   4. Builds linux/amd64 tarball + SHA256SUMS
#   5. Creates/updates the GitHub Release and attaches the assets
#      (install.sh / upgrade.sh download those assets)
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver without leading v (e.g. 1.0.0)
        required: true
        type: string
      prerelease:
        description: Mark GitHub Release as prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          fetch-depth: 0
          # Push VERSION commit + tag back to the branch that triggered the run.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7.0.0 # v6.1.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Normalize version
        id: ver
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version }}"
          VER="${RAW#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be X.Y.Z (got '$RAW')" >&2
            exit 1
          fi
          TAG="v${VER}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists" >&2
            exit 1
          fi
          echo "version=${VER}" >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"

      - name: Write VERSION and sync packages
        run: |
          set -euo pipefail
          chmod +x scripts/set-version.sh scripts/sync-version.sh deploy/build-release.sh
          ./scripts/set-version.sh "${{ steps.ver.outputs.version }}"

      - name: Commit VERSION onto branch
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION web/package.json web/package-lock.json
          if git diff --cached --quiet; then
            echo "VERSION already at ${VER}; no package commit needed"
          else
            git commit -m "chore(release): set VERSION to ${VER}"
          fi
          git push origin "HEAD:${{ github.ref_name }}"
          git tag -a "${TAG}" -m "Redgres ${TAG}"
          git push origin "${TAG}"

      - name: Build release tarball
        run: |
          set -euo pipefail
          ./deploy/build-release.sh "${{ steps.ver.outputs.version }}"
          ls -la dist/release
          test -f "dist/release/redgres_${{ steps.ver.outputs.version }}_linux_amd64.tar.gz"
          test -f dist/release/SHA256SUMS

      - name: Publish GitHub Release + assets
        uses: softprops/action-gh-release@v3.0.2 # v2.3.3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Redgres ${{ steps.ver.outputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/release/redgres_${{ steps.ver.outputs.version }}_linux_amd64.tar.gz
            dist/release/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
