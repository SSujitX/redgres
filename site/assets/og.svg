<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Redgres  self-hosted PostgreSQL and Redis">
  <rect width="1200" height="630" fill="#f4f6f8"/>
  <rect x="0" y="0" width="1200" height="8" fill="#1a7f37"/>
  <text x="80" y="220" fill="#17202a" font-family="Segoe UI, system-ui, sans-serif" font-size="72" font-weight="700">Redgres</text>
  <text x="80" y="300" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="36">Self-hosted PostgreSQL + Redis</text>
